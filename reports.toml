# The reports the site publishes, one `[[report]]` per document.
#
# Adding the next report is an entry here and nothing else:
# the site path comes from the document's own `URL:` line,
# so nothing in this file or in the workflow names a report twice.
#
# `name` is what the document is called in Drive, not the report's headline:
# it is what you search for to find the doc this entry points at.
# A build refuses the report when the two have drifted apart,
# which it can only know once it has fetched the document.
#
# `tab` is what that tab is called, checked the same way and for the same reason:
# a `?tab=` id is opaque, so nothing about the URL says which draft it points at,
# and picking up last year's draft is a mistake the URL cannot show you.
#
# Both have to be right, and a blank one is wrong like any other wrong value:
# no document is called nothing.
# Neither is anything a URL can supply, and typing them out of Drive by hand
# is the step that gets them wrong, so `eta-publish add <url>`
# writes an entry with the names read off the document itself.
#
# `url` is the Docs URL including its `?tab=` id.
# ETA documents have many tabs, several of them obsolete drafts,
# and the API returns the first tab unless told otherwise,
# so a URL without one publishes the wrong draft.

[[report]]
name = "SAS West Feasibility Response"
tab = "Draft 2"
url = "https://docs.google.com/document/d/1U-M71SN5azsWSLAnp_1cPaPBj8YDHfb9Z8uoopVopBg/edit?tab=t.ul3yzv5xed4w"

