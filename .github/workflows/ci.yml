name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `biome` formats the emitted HTML, so a build without it writes
      # nothing, and the tests compare against pages it laid out.
      - uses: jdx/mise-action@v3

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      # The `network` marker is deselected by default (see `pyproject.toml`),
      # so CI never needs Google credentials.
      - name: pytest
        run: uv run pytest
