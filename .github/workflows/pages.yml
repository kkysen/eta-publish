# Publish the site to GitHub Pages, built from the live Google Doc.
#
# On every push to `main`, so that what is published is what the repository
# says. Publishing was manual, on the reasoning that a report goes out when
# someone decides it is ready; merging to `main` is that decision, and a
# deploy that has to be remembered separately is one that gets forgotten.
#
# Note what this means: the deploy is built by fetching the documents, not
# from the committed `site/`, so a push republishes whatever the Google Doc
# says at that moment rather than whatever was committed. It has to be that
# way, because the images are not in the repository (18 MB, and every fetch
# rewrites them), so a checkout alone is not a site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      doc:
        description: "Doc URL to build on its own; defaults to every entry in reports.toml"
        required: false
        type: string

# Read-only on the repository. `pages` and `id-token` are what the deploy
# needs, and nothing here writes a commit.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish: cancelling mid-deploy
# can leave the site serving a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Written to the runner's temp directory rather than the workspace, so
      # it cannot be picked up by a later step that globs the checkout.
      - name: Write the service account key
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "::error::the GOOGLE_CREDENTIALS secret is not set; see README" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/key.json"

      # Pinned rather than latest: the PDF is a deliverable, and a Typst
      # release that changed layout would silently reflow it.
      - name: Install Typst
        run: |
          version=0.15.1
          url="https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP" \
            "typst-x86_64-unknown-linux-musl/typst"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Which documents to build lives in `reports.toml`, so adding the next
      # report is a pull request rather than an edit to this file. The
      # dispatch input builds one document on its own, for a report that is
      # not on the list yet.
      - name: Build the reports
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
          DOC: ${{ inputs.doc }}
        run: |
          if [ -n "$DOC" ]; then
            uv run eta-publish "$DOC" -o site
          else
            uv run eta-publish -o site
          fi

      # What is deployed has to be what was reviewed. A push deploys by
      # fetching the documents, so without this it would publish whatever
      # Google Docs said at that moment: a sentence someone was still
      # editing, or a paragraph deleted an hour ago and not yet restored.
      #
      # A build is deterministic, so if the documents have not changed since
      # they were committed, it rewrites the committed files byte for byte
      # and there is no diff. `doc.json` covers the text and `images.json`
      # covers the pictures, which are not committed themselves but whose
      # hashes are.
      #
      # Failing here publishes nothing and keeps the previous deploy up,
      # which is the safe direction: the fix is to re-run the build locally
      # and commit what it produces, which is the same act as reviewing it.
      - name: Check the build matches what was committed
        run: |
          if ! git diff --quiet -- site; then
            git diff --stat -- site >&2
            echo '::error::the documents have changed since site/ was committed; run' \
                 '"uv run eta-publish" locally, review the diff, and commit the result' >&2
            exit 1
          fi

      # The deploy is a copy of `site/`: a build already writes each report
      # as `index.html` in its own directory, with the site index beside
      # them. One file is removed rather than served.
      #
      # `doc.json` is the API response as fetched, so it carries the email
      # address behind every person chip, and `Public Contributors:` is made
      # of person chips. The report publishes the names; publishing the
      # response would publish the addresses too, at a stable URL, which is
      # not something a report does. It is also 441 KB of raw JSON and
      # signed image URLs that nothing on the site reads.
      #
      # `template.typ` stays. `report.typ` imports it, so serving the Typst
      # source without it would be serving source that does not compile.
      - name: Drop the API response
        run: find site -name doc.json -delete

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
