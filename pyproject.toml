[project]
name = "eta-publish"
version = "0.1.0"
description = "Convert ETA Google Doc reports into publish-ready HTML."
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
]

[project.scripts]
eta-publish = "eta_publish.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eta_publish"]
