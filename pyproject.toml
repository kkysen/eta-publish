[project]
name = "eta-publish"
version = "0.1.0"
description = "Convert ETA Google Doc reports into publish-ready HTML."
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "pillow>=11.0",
    "requests>=2.32",
    "typer>=0.27.1",
]

[project.scripts]
eta-publish = "eta_publish.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=1.2.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eta_publish"]
artifacts = ["eta_publish/assets/*.typ"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
preset = "strict"
# Test modules import each other by name, the way `pytest` resolves them.
search-path = ["tests"]

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anything reaching the Docs API is opt-in: `uv run pytest -m network`.
# Everything else runs against the checked-in fixture, so neither CI nor a
# pre-commit hook ever needs Google credentials.
markers = ["network: needs internet access and Google credentials"]
addopts = "-m 'not network'"
