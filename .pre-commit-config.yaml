# `pre-commit install` installs both,
# so a clone that follows the README gets the push check as well as the commit checks.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.2.0"
    hooks:
      - id: pyrefly-check
        additional_dependencies:
          [
            "google-api-python-client>=2.130",
            "pillow>=11.0",
            "google-auth-oauthlib>=1.2",
            "requests>=2.32",
            "types-requests>=2.32",
            "pytest>=9.1.1",
            "typer>=0.27",
          ]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      # On push rather than on commit:
      # it fetches every document, which is slow and needs credentials.
      # On every branch, though only `main` deploys:
      # a branch whose site is already stale is a merge that will fail,
      # and the point is not to find that out at the merge.
      - id: committed-site
        name: the committed site is what a fresh build writes
        entry: scripts/check-committed-site.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
